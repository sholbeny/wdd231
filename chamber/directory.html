<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Andover Chamber of Commerce | Business Directory</title>

    <meta
        name="description"
        content="Explore local businesses and organizations in the Andover, Minnesota Chamber of Commerce directory."
    >
    <meta name="author" content="Sammi Holbeny">

    <!-- Favicon -->
    <link rel="icon" href="images/favicon.ico">

    <!-- Facebook Open Graph Meta Tags -->
    <meta
        property="og:title"
        content="Andover Chamber of Commerce | Business Directory"
    >
    <meta
        property="og:description"
        content="Explore local businesses and organizations serving the Andover, Minnesota community."
    >
    <meta
        property="og:image"
        content="https://sholbeny.github.io/wdd231/chamber/images/andover-chamber-logo.webp"
    >
    <meta
        property="og:url"
        content="https://sholbeny.github.io/wdd231/chamber/directory.html"
    >
    <meta property="og:type" content="website">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <!-- CSS -->
    <link rel="stylesheet" href="styles/normalize.css">
    <link rel="stylesheet" href="styles/small.css">
    <link rel="stylesheet" href="styles/larger.css">

    <!-- JavaScript -->
    <script src="scripts/navigation.js" defer></script>
    <script src="scripts/directory.js" defer></script>
</head>

<body>

    <header>
        <div class="header-content">

            <!-- Chamber Logo -->
            <a href="index.html" class="branding">
                <img
                    src="images/andover-chamber-logo.webp"
                    alt="Andover Chamber of Commerce"
                    width="300"
                    height="150"
                >
            </a>

            <!-- Mobile Menu Button -->
            <button
                id="menu"
                type="button"
                aria-label="Open navigation menu"
                aria-expanded="false"
            >
                ☰
            </button>

            <!-- Main Navigation -->
            <nav id="navigation" aria-label="Main navigation">
                <a href="index.html">Home</a>
                <a href="discover.html">Discover</a>
                <a
                    href="directory.html"
                    class="active"
                    aria-current="page"
                >
                    Directory
                </a>
                <a href="join.html">Join</a>
            </nav>

        </div>
    </header>

    <main>

        <h1>Business Directory</h1>

        <!-- Grid/List Controls -->
        <div class="view-buttons">
            <button id="grid" type="button">
                Grid
            </button>

            <button id="list" type="button">
                List
            </button>
        </div>

        <!--
            Business member cards will be generated
            here using directory.js and members.json.
        -->
        <div id="members" class="grid"></div>

    </main>

    <footer>

        <div class="footer-content">

            <!-- Chamber Contact Information -->
            <div class="chamber-info">
                <p>
                    <strong>Andover Chamber of Commerce</strong>
                </p>

                <p>Andover, Minnesota 55304</p>

                <p>
                    info@andoverchamber.example
                </p>
            </div>

            <!-- Social Media Links -->
            <div class="social-links">

                <a
                    href="https://www.youtube.com/"
                    target="_blank"
                    rel="noopener"
                    aria-label="YouTube"
                >
                    YouTube
                </a>

                <a
                    href="https://www.facebook.com/"
                    target="_blank"
                    rel="noopener"
                    aria-label="Facebook"
                >
                    Facebook
                </a>

                <a
                    href="https://www.linkedin.com/"
                    target="_blank"
                    rel="noopener"
                    aria-label="LinkedIn"
                >
                    LinkedIn
                </a>

            </div>

            <!-- Class / Development Information -->
            <div class="development-info">

                <p>WDD 231 Class Project</p>

                <p>Sammi Holbeny</p>

                <p>
                    &copy;
                    <span id="currentyear"></span>
                    Andover Chamber of Commerce
                </p>

                <p id="lastModified"></p>

            </div>

        </div>

    </footer>

</body>

</html>
